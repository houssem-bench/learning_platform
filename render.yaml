services:
  - type: web
    name: learning-platform-api
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        value: sqlite:////var/data/app.db
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        value: admin123
      - key: CORS_ORIGINS
        value: http://localhost:5173,https://learning-platform-frontend.onrender.com
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1

  - type: web
    name: learning-platform-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        value: https://learning-platform-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
